name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    name: AI service (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # The tests set their own environment and fake the model clients, so no API keys are needed.
      - run: uv run pytest -q
